<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-labelledby="t2 d2" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t2">How Livella works</title>
<desc id="d2">Audio from video and music apps is captured, muted at the source, and played to the headphones by Livella with its own gain. The call app plays directly to the headphones, untouched. A speech detector reads only the level of the call audio and of your microphone, and tells Livella when to lower and restore the volume.</desc>
<rect width="880" height="430" rx="14" fill="#1a1a19"/>
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3987e5"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/></marker>
</defs>
<text x="28" y="38" fill="#f0efec" font-size="19" font-weight="600">How Livella works</text>
<rect x="36" y="76" width="210" height="62" rx="10" fill="#262624" stroke="#5c5b56" stroke-width="1.5"/>
<text x="141.0" y="112.0" fill="#f0efec" font-size="15" font-weight="600" text-anchor="middle">Video and music apps</text>
<rect x="36" y="216" width="210" height="62" rx="10" fill="#262624" stroke="#5c5b56" stroke-width="1.5"/>
<text x="141.0" y="242" fill="#f0efec" font-size="15" font-weight="600" text-anchor="middle">Call app</text>
<text x="141.0" y="262" fill="#c3c2b7" font-size="12.5" text-anchor="middle">found by itself: it uses the mic</text>
<rect x="36" y="330" width="210" height="62" rx="10" fill="#262624" stroke="#5c5b56" stroke-width="1.5"/>
<text x="141.0" y="366.0" fill="#f0efec" font-size="15" font-weight="600" text-anchor="middle">Your microphone</text>
<rect x="350" y="68" width="230" height="78" rx="10" fill="#262624" stroke="#5c5b56" stroke-width="1.5"/>
<text x="465.0" y="94" fill="#f0efec" font-size="15" font-weight="600" text-anchor="middle">Livella</text>
<text x="465.0" y="114" fill="#c3c2b7" font-size="12.5" text-anchor="middle">brings the volume back up,</text>
<text x="465.0" y="131" fill="#c3c2b7" font-size="12.5" text-anchor="middle">lowers it while someone speaks</text>
<rect x="350" y="300" width="230" height="78" rx="10" fill="#262624" stroke="#5c5b56" stroke-width="1.5"/>
<text x="465.0" y="326" fill="#f0efec" font-size="15" font-weight="600" text-anchor="middle">Speech detector</text>
<text x="465.0" y="346" fill="#c3c2b7" font-size="12.5" text-anchor="middle">voice only: ignores clicks, claps,</text>
<text x="465.0" y="363" fill="#c3c2b7" font-size="12.5" text-anchor="middle">noise and quieter voices</text>
<rect x="690" y="150" width="154" height="62" rx="10" fill="#262624" stroke="#5c5b56" stroke-width="1.5"/>
<text x="767.0" y="186.0" fill="#f0efec" font-size="15" font-weight="600" text-anchor="middle">Headphones</text>
<path d="M246,107 L348,107" fill="none" stroke="#3987e5" stroke-width="2.5" marker-end="url(#ab)"/>
<text x="297" y="96" fill="#c3c2b7" font-size="12.5" text-anchor="middle">audio, muted</text>
<text x="297" y="128" fill="#c3c2b7" font-size="12.5" text-anchor="middle">at the source</text>
<path d="M580,107 L767,107 L767,148" fill="none" stroke="#3987e5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ab)"/>
<text x="672" y="96" fill="#c3c2b7" font-size="12.5" text-anchor="middle">audio with new gain</text>
<path d="M246,240 L767,240 L767,214" fill="none" stroke="#c3c2b7" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ag)"/>
<text x="560" y="230" fill="#c3c2b7" font-size="12.5" text-anchor="middle">call audio, untouched</text>
<path d="M246,262 L300,262 L300,326 L348,326" fill="none" stroke="#c3c2b7" stroke-width="1.8" stroke-dasharray="3 5" stroke-linejoin="round" marker-end="url(#ag)"/>
<path d="M246,361 L348,361" fill="none" stroke="#c3c2b7" stroke-width="1.8" stroke-dasharray="3 5" marker-end="url(#ag)"/>
<text x="297" y="382" fill="#c3c2b7" font-size="12.5" text-anchor="middle">level only</text>
<path d="M465,300 L465,148" fill="none" stroke="#c3c2b7" stroke-width="1.8" stroke-dasharray="3 5" marker-end="url(#ag)"/>
<text x="477" y="275" fill="#c3c2b7" font-size="12.5">someone is speaking</text>
<line x1="610" y1="330" x2="640" y2="330" stroke="#3987e5" stroke-width="2.5"/><text x="650" y="334.5" fill="#f0efec" font-size="12.5">audio handled by Livella</text>
<line x1="610" y1="352" x2="640" y2="352" stroke="#c3c2b7" stroke-width="2.5"/><text x="650" y="356.5" fill="#f0efec" font-size="12.5">audio left as it is</text>
<line x1="610" y1="374" x2="640" y2="374" stroke="#c3c2b7" stroke-width="1.8" stroke-dasharray="3 5"/><text x="650" y="378.5" fill="#f0efec" font-size="12.5">level measured, nothing recorded</text>
</svg>